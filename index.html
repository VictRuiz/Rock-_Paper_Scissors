<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>

    <script>
    // Elección aleatoria del computador
    const getComputerChoice = function() {
      const choices = ["piedra", "papel", "tijera"];
      const index = Math.floor(Math.random() * choices.length);
      return choices[index];
    };

    // Elección del usuario (por prompt)
    const getHumanChoice = function() {
      let choice = prompt("Elige: piedra, papel o tijera").toLowerCase();
      while (!["piedra", "papel", "tijera"].includes(choice)) {
        choice = prompt("Entrada inválida. Elige: piedra, papel o tijera").toLowerCase();
      }
      return choice;
    };

    // Función para jugar una ronda
    const playRound = function(human, computer) {
      if (human === computer) {
        return "Empate 🤝";
      }

      if (
        (human === "piedra" && computer === "tijera") ||
        (human === "papel" && computer === "piedra") ||
        (human === "tijera" && computer === "papel")
      ) {
        return `¡Ganaste! ${human} vence a ${computer} 🎉`;
      } else {
        return `Perdiste 😢 ${computer} vence a ${human}`;
      }
    };

    // Jugar una ronda
    const humanChoice = getHumanChoice();
    const computerChoice = getComputerChoice();
    const result = playRound(humanChoice, computerChoice);

    // Mostrar resultados
    alert(`Elegiste: ${humanChoice}\nComputadora eligió: ${computerChoice}\n\n${result}`);
    console.log(result);
  </script>

</body>
</html>
